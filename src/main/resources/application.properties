spring.application.name=orquestador-service

# Puerto por defecto donde Ollama escucha peticiones
langchain4j.ollama.chat-model.base-url=http://localhost:11434

# El nombre exacto de tu modelo compilado
langchain4j.ollama.chat-model.model-name=prueba-asistente

# Forzamos temperatura 0 para respuestas deterministas
langchain4j.ollama.chat-model.temperature=0.0

# Configuramos el puerto del servidor web de Spring (opcional)
server.port=8080
